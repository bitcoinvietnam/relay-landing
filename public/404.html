<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // This script handles the redirection for GitHub Pages
      ;(function () {
        // Redirect to index.html, but keep the correct path in the URL
        var redirectTo = window.location.pathname
        if (redirectTo !== '/') {
          window.location.replace('/relay/?' + redirectTo)
        }
      })()
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
  </body>
</html>
